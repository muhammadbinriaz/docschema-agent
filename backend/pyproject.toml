[project]
name = "docschema-backend"
version = "0.1.0"
description = "DocSchema — document to structured data with human review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
