services:
  postgres:
    image: postgres:16-alpine
    container_name: docschema-postgres
    environment:
      POSTGRES_USER: docschema
      POSTGRES_PASSWORD: docschema
      POSTGRES_DB: docschema
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docschema -d docschema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
